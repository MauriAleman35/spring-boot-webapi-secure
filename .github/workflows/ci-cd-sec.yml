name: CI/CD - Spring Boot DevSecOps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================================================================
  # 1. CI JOBS
  # ==================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test with coverage
        run: mvn -B clean verify

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=off \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          retention-days: 7

  static-analysis:
    name: Static Analysis - SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Run SpotBugs
        run: mvn -B compile com.github.spotbugs:spotbugs-maven-plugin:check || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-reports
          path: target/spotbugsXml.xml
          retention-days: 7

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-semgrep, static-analysis]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: semgrep-reports
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: spotbugs-reports
          path: target/
        continue-on-error: true
      - name: Evaluate Quality Gate
        run: |
          python scripts/check_quality_gate.py \
            --semgrep semgrep-results.json \
            --spotbugs target/spotbugsXml.xml

  # ==================================================================
  # 2. CD JOBS – Docker Build & Vulnerability Scan
  # ==================================================================
  docker-build-and-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'